<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Salário - Turno Fixo (Murata / Fuji)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #333941;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 450px;
      margin: 0 auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      color: #1b365d;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      color: #333;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background-color: #0056b3;
    }
    .resultado {
      margin-top: 20px;
      padding: 15px;
      background-color: #e9ecef;
      border-radius: 8px;
    }
    .resultado h3 {
      margin: 0 0 10px 0;
      color: #28a745;
      text-align: center;
    }
    .item-resumo {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Calculadora de Salário<br><small style="font-size: 14px; font-weight: normal;">Turno Fixo Diurno (4x2)</small></h2>

  <div class="form-group">
    <label for="jikyuu">Valor por Hora (¥):</label>
    <input type="number" id="jikyuu" value="1400">
  </div>

  <div class="form-group">
    <label for="diasTrabalhados">Dias Trabalhados no Mês:</label>
    <input type="number" id="diasTrabalhados" value="20">
  </div>

  <div class="form-group">
    <label for="horasNormais">Horas Normais por Dia:</label>
    <input type="number" id="horasNormais" value="9">
  </div>

  <div class="form-group">
    <label for="horasExtras">Horas Extras por Dia (+25%):</label>
    <input type="number" id="horasExtras" value="2">
  </div>

  <div class="form-group">
    <label for="horasDomingo">Total de Horas em Domingo (+35%):</label>
    <input type="number" id="horasDomingo" value="0" placeholder="Ex: 11 se trabalhou no domingo">
  </div>

  <button onclick="calcular()">Calcular Salário Bruto</button>

  <div class="resultado" id="painelResultado" style="display:none;">
    <h3 id="totalBruto">Total: ¥0</h3>
    <hr>
    <div class="item-resumo">
      <span>Horas Normais:</span>
      <strong id="resNormais">¥0</strong>
    </div>
    <div class="item-resumo">
      <span>Horas Extras (+25%):</span>
      <strong id="resExtras">¥0</strong>
    </div>
    <div class="item-resumo">
      <span>Adicional Domingo (+35%):</span>
      <strong id="resDomingo">¥0</strong>
    </div>
    <div class="item-resumo">
      <span>Valor da Diária Média:</span>
      <strong id="resDiaria">¥0</strong>
    </div>
  </div>
</div>

<script>
  function calcular() {
    const jikyuu = parseFloat(document.getElementById('jikyuu').value) || 0;
    const dias = parseFloat(document.getElementById('diasTrabalhados').value) || 0;
    const hNormaisDia = parseFloat(document.getElementById('horasNormais').value) || 0;
    const hExtrasDia = parseFloat(document.getElementById('horasExtras').value) || 0;
    const hDomingoTotal = parseFloat(document.getElementById('horasDomingo').value) || 0;

    // Totais de horas
    const totalHNormais = dias * hNormaisDia;
    const totalHExtras = dias * hExtrasDia;

    // Valores por tipo
    const valNormais = totalHNormais * jikyuu;
    const valExtras = totalHExtras * (jikyuu * 1.25);
    const valDomingo = hDomingoTotal * (jikyuu * 1.35);

    const valorTotal = valNormais + valExtras + valDomingo;
    const valorDiaria = (hNormaisDia * jikyuu) + (hExtrasDia * jikyuu * 1.25);

    // Exibir resultados
    document.getElementById('totalBruto').innerText = `Total Bruto: ¥${Math.round(valorTotal).toLocaleString('ja-JP')}`;
    document.getElementById('resNormais').innerText = `¥${Math.round(valNormais).toLocaleString('ja-JP')}`;
    document.getElementById('resExtras').innerText = `¥${Math.round(valExtras).toLocaleString('ja-JP')}`;
    document.getElementById('resDomingo').innerText = `¥${Math.round(valDomingo).toLocaleString('ja-JP')}`;
    document.getElementById('resDiaria').innerText = `¥${Math.round(valorDiaria).toLocaleString('ja-JP')}`;

    document.getElementById('painelResultado').style.display = 'block';
  }
</script>

</body>
</html>
