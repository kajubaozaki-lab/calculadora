<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Salário - 4x2 Japão</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f1f5f9;
      margin: 0;
      padding: 20px;
      color: #0f172a;
    }
    .card {
      max-width: 450px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }
    h2 {
      margin-top: 0;
      font-size: 22px;
      text-align: center;
      color: #0284c7;
    }
    p.subtitle {
      text-align: center;
      font-size: 13px;
      color: #64748b;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #334155;
    }
    input[type="number"], select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }
    .shift-toggle {
      display: flex;
      gap: 10px;
    }
    .shift-toggle button {
      flex: 1;
      padding: 12px;
      border: 2px solid #cbd5e1;
      background: #f8fafc;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }
    .shift-toggle button.active {
      border-color: #0284c7;
      background-color: #e0f2fe;
      color: #0369a1;
    }
    button.btn-calc {
      width: 100%;
      background-color: #0284c7;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 10px;
      cursor: pointer;
    }
    .result-box {
      margin-top: 20px;
      background-color: #f8fafc;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #e2e8f0;
    }
    .total-price {
      font-size: 24px;
      font-weight: bold;
      color: #16a34a;
      text-align: center;
      margin-bottom: 12px;
    }
    .detail-item {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      padding: 6px 0;
      border-bottom: 1px dashed #e2e8f0;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Calculadora de Salário</h2>
  <p class="subtitle">Fechamento do dia 21 ao dia 20 (Turno 4x2 - 11h/dia)</p>

  <div class="form-group">
    <label>Valor por Hora (¥):</label>
    <input type="number" id="valorHora" value="1550">
  </div>

  <div class="form-group">
    <label>Dias Totais Trabalhados no Período:</label>
    <input type="number" id="diasTotais" placeholder="Ex: 18">
  </div>

  <div class="form-group">
    <label>Desses dias, quantos foram DOMINGOS?</label>
    <input type="number" id="diasDomingo" value="0" placeholder="Ex: 1">
  </div>

  <div class="form-group">
    <label>Qual foi seu Turno?</label>
    <div class="shift-toggle">
      <button type="button" id="btnDia" class="active" onclick="setShift('dia')">☀️ DIA</button>
      <button type="button" id="btnNoite" onclick="setShift('noite')">🌙 NOITE</button>
    </div>
  </div>

  <button class="btn-calc" onclick="calcular()">Calcular Salário Bruto</button>

  <div class="result-box" id="resultado" style="display:none;">
    <div class="total-price" id="totalBruto">¥0</div>
    <div class="detail-item"><span>Dias Úteis (Semana):</span> <strong id="detUteis">0</strong></div>
    <div class="detail-item"><span>Domingos (35%):</span> <strong id="detDomingos">0</strong></div>
    <div class="detail-item"><span>Horas Extras (+25%):</span> <strong id="detExtras">¥0</strong></div>
    <div class="detail-item" id="rowNoturno" style="display:none;"><span>Adicional Noturno (+25%):</span> <strong id="detNoturno">¥0</strong></div>
  </div>
</div>

<script>
  let turnoAtual = 'dia';

  function setShift(turno) {
    turnoAtual = turno;
    document.getElementById('btnDia').classList.toggle('active', turno === 'dia');
    document.getElementById('btnNoite').classList.toggle('active', turno === 'noite');
  }

  function calcular() {
    const valorHora = parseFloat(document.getElementById('valorHora').value) || 0;
    const diasTotais = parseInt(document.getElementById('diasTotais').value) || 0;
    const diasDomingo = parseInt(document.getElementById('diasDomingo').value) || 0;

    const diasUteis = Math.max(0, diasTotais - diasDomingo);

    // Na jornada de 11h: 9h normais + 2h extras por dia útil
    const valorHoraNormal = valorHora;
    const valorHoraExtra = valorHora * 1.25;
    const valorHoraDomingo = valorHora * 1.35;
    const valorAdicionalNoturno = valorHora * 0.25; // 25% extra por hora noturna

    // Cálculos por Dia Útil
    const totalNormais = diasUteis * 9 * valorHoraNormal;
    const totalExtras = diasUteis * 2 * valorHoraExtra;

    // Cálculo por Domingo (11h a +35%)
    const totalDomingos = diasDomingo * 11 * valorHoraDomingo;

    // Cálculo Noturno Automático (5h noturnas por dia se for turno NOITE)
    let totalNoturno = 0;
    if (turnoAtual === 'noite') {
      const horasNoturnasPorDia = 5;
      totalNoturno = diasTotais * horasNoturnasPorDia * valorAdicionalNoturno;
      document.getElementById('rowNoturno').style.display = 'flex';
      document.getElementById('detNoturno').innerText = '¥' + Math.round(totalNoturno).toLocaleString('ja-JP');
    } else {
      document.getElementById('rowNoturno').style.display = 'none';
    }

    const totalBruto = totalNormais + totalExtras + totalDomingos + totalNoturno;

    document.getElementById('totalBruto').innerText = 'Total Bruto: ¥' + Math.round(totalBruto).toLocaleString('ja-JP');
    document.getElementById('detUteis').innerText = diasUteis + ' dias';
    document.getElementById('detDomingos').innerText = diasDomingo + ' dias';
    document.getElementById('detExtras').innerText = '¥' + Math.round(totalExtras).toLocaleString('ja-JP');

    document.getElementById('resultado').style.display = 'block';
  }
</script>

</body>
</html>
